# Qué modelo de Claude hace cada tarea de la app.
#
# Para cambiar de modelo basta con cambiar el nombre aquí. Modelos actuales
# (precio por millón de «tokens», trocitos de texto, de entrada / salida; oct. 2026):
#   claude-haiku-5-5   0,10 $ / 0,50 $   (rápido y barato)
#   claude-sonnet-5-5  2 $ / 10 $
#   claude-opus-5-5    4 $ / 20 $        (el más preciso de uso general)
#
# Elegidos con la prueba de los tres modelos del 8/11/2026
# (docs/pruebas/2026-11-08-prueba-modelos.md): todos aciertan la magia, pero
# en los casos difíciles Haiku se equivoca muy seguro de sí mismo (y así sus
# fallos nunca llegarían a revisarse), mientras que Sonnet avisa cuando duda.
# Por eso clasifica Sonnet y solo lo dudoso sube a Opus. Pendiente de que Uri
# lo apruebe; para cambiarlo basta con cambiar el nombre del modelo.
#
# La IA solo funciona si existe la clave (secreto ANTHROPIC_API_KEY en GitHub,
# o CLAVE_IA_CARTELERA en el entorno de la nube de Claude). Sin ella, la app clasifica con la capa de señales y no gasta nada.

# 1. Clasificar actividades nuevas o cambiadas (tipo, relación con la magia…).
[clasificar]
activa = true
modelo = "claude-sonnet-5-5"
esfuerzo = "medium"            # low, medium, high: cuánto «piensa» antes de responder
por_peticion = 10              # actividades que se envían juntas en cada petición
maximo_por_ejecucion = 1000    # tope diario, para controlar el coste

# 2. Revisar los casos dudosos con un modelo superior.
#    Se vuelven a mirar las decisiones de la tarea anterior con una seguridad
#    («confianza») menor que el umbral.
[revisar_dudosos]
activa = true
modelo = "claude-opus-5-5"
esfuerzo = "medium"
umbral_confianza = 0.7
por_peticion = 5
maximo_por_ejecucion = 200

# 3. Fichas de trayectoria y premios (fase 3; todavía no se usa).
[fichas_personas]
activa = true
# Opus da fichas algo más completas (0,42 $ por artista en la prueba del 17/11/2026);
# Sonnet cuesta la mitad. Cada artista se busca una vez cada 60 días.
modelo = "claude-sonnet-5-5"
esfuerzo = "medium"
maximo_por_ejecucion = 20     # hoy solo magos y magas (búsqueda web: 10 $ cada 1000 búsquedas)

# Freno de gasto: si una ejecución llega a este tope (en dólares), ninguna tarea de IA
# vuelve a llamar a la IA hasta el día siguiente. Lo pendiente se hace otro día.
[presupuesto]
maximo_usd_por_ejecucion = 2.0

# 4. Traducir al castellano las descripciones que la fuente da en catalán (y al revés).
[traducir]
activa = true
modelo = "claude-haiku-5-5"
esfuerzo = "low"
por_peticion = 5
maximo_por_ejecucion = 1500

# 5. Leer los horarios de las webs de los cines (la IA convierte la página en sesiones).
[horarios_cine]
activa = true
modelo = "claude-haiku-5-5"
esfuerzo = "low"
por_peticion = 1
maximo_por_ejecucion = 60

# 6. Clasificar las noticias (teatro, cine, magia o circo; o nada que ver).
[noticias]
activa = true
modelo = "claude-haiku-5-5"
esfuerzo = "low"
por_peticion = 30
maximo_por_ejecucion = 400

# Lector de webs de salas (pipeline/fuentes/webs_salas): extraer la programación de la web
# oficial de las salas que no salen en la agenda municipal. Solo extraer datos, sin interpretar
# (por eso el modelo barato); cada dato se comprueba después contra el texto de la página.
# Solo se vuelve a pedir cuando la página cambia.
[leer_webs]
activa = true
modelo = "claude-haiku-5-5"
esfuerzo = "low"
por_peticion = 1
maximo_por_ejecucion = 120
