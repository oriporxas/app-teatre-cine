# Medios de los que salen las noticias de la app (canales RSS públicos).
# La IA (tarea «noticias» de ia.toml) decide de qué va cada noticia: teatro, cine, magia o circo
# (las demás —exposiciones, música, libros…— no salen); si trata de un evento (festival, gala o
# premios, feria, convención, taller…); y su ámbito: Barcelona, España o Mundo (Uri, 18/11/2026).
# La app enseña el titular, el medio, la fecha y un resumen breve escrito por la IA (en castellano
# y catalán, también de las noticias en inglés), y enlaza siempre al artículo original.
#
# «ambito»: de dónde es el medio (barcelona, espana o mundo). Es una pista: la IA mira de qué
# trata cada noticia (un medio de Madrid puede hablar de un estreno en Barcelona).
# «dias»: cuántos días atrás se miran (10 si no se dice). Los medios de magia o circo publican
# menos, así que se mira más atrás.
# Solo canales cuyo robots.txt deja leerlos (se comprueba en cada lectura). Comprobados el
# 17-18/11/2026. No se pueden usar (lo prohíben o no tienen canal): Núvol, Recomana, Teatre
# Barcelona, Escena Catalana, Revista Teatral, Circ.cat, Google Noticias, El País, RTVE, Butaca en
# Anfiteatro, Artezblai (sin noticias desde enero), El Periódico, El Nacional, Time Out, 3Cat,
# The Stage, BroadwayWorld, WhatsOnStage, Screen Daily, Vanish, Magicseen, CircusTalk, Circostrada.

