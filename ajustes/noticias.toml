# Medios de los que salen las noticias de la app (canales RSS públicos).
# La IA (tarea «noticias» de ia.toml) decide de qué va cada noticia: teatro, cine,
# magia o circo. Las demás (exposiciones, música, libros…) no salen.
# La app enseña el titular, el medio, la fecha y un resumen breve escrito por la IA,
# y enlaza siempre al artículo original. La IA marca además si la noticia trata de un
# evento (festival, gala o premios, feria, convención, taller…): pestaña «Eventos».
#
# «dias»: cuántos días atrás se miran (10 si no se dice). Los medios especializados en magia
# o circo publican menos, así que se mira más atrás.
# Solo canales cuyo robots.txt deja leerlos (se comprueba en cada lectura). Comprobados el
# 17/11/2026; no se pudieron usar (lo prohíben o no tienen canal): Núvol, Recomana,
# Teatre Barcelona, Escena Catalana, Circ.cat, Google Noticias, webs de tiendas de magia,
# El País (su robots.txt no deja leer el canal). Artezblai: su canal lleva meses sin noticias.

