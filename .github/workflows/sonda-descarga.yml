# Prueba temporal de desarrollo: comprueba si desde los servidores de GitHub
# se puede descargar el JSON completo de Open Data BCN. Se borrará cuando
# exista el proceso diario definitivo.
name: Sonda de descarga

on:
  push:
    branches: ["claude/**"]
    paths:
      - "pipeline/descargar.py"
      - "pipeline/explorar.py"
      - ".github/workflows/sonda-descarga.yml"

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar agendas
        run: python pipeline/descargar.py
      - name: Resumir estructura
        run: python pipeline/explorar.py descargas/activitats.json descargas/cultural.json
