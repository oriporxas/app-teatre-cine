# Prueba temporal: ¿pueden los servidores de GitHub leer la guía del Ayuntamiento?
# Se borrará en cuanto se compruebe.
name: Sonda guía

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/sonda-guia.yml"]

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer dos fichas de la guía (con 10 s de espera entre ellas)
        run: |
          python - <<'EOF'
          import time, urllib.request
          from pipeline import guia
          for i, url in enumerate(["https://guia.barcelona.cat/ca/detall/espectacle_99400781427.html",
                                   "https://guia.barcelona.cat/ca/detall/espectacle_99400786807.html"]):
              if i: time.sleep(10)
              try:
                  html = urllib.request.urlopen(url, timeout=60).read().decode("utf-8", "replace")
                  d = guia.analizar(html)
                  print("OK", url, "| sala:", d.get("sala"), "| descripción:", len(d.get("descripcion") or ""), "caracteres")
              except Exception as e:
                  print("FALLO", url, type(e).__name__, e)
          EOF
      - name: Equipamientos por la API
        run: |
          python -c "from pipeline import salas; import pathlib; print('equipamientos', len(salas.descargar_equipamientos(pathlib.Path('descargas'))))"
