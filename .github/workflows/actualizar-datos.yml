# Proceso diario: descarga las agendas, lee fichas nuevas, clasifica, lee los
# horarios de los cines y las noticias, y guarda los resultados en data/ y en
# web/public/datos/. El gasto de IA tiene un tope diario (ajustes/ia.toml). Funciona solo: nadie
# tiene que revisar nada. También se puede lanzar a mano desde la pestaña
# «Actions» → «Actualizar datos» → «Run workflow».
name: Actualizar datos

on:
  schedule:
    # Cada día a las 05:17 (hora UTC; 06:17 en invierno y 07:17 en verano en
    # Barcelona). El Ayuntamiento actualiza sus agendas de madrugada.
    - cron: "17 5 * * *"
    # Mediodía (13:17 UTC; 14:17 en invierno en Barcelona): si la de la mañana no dejó los datos
    # del día (p. ej. el 18/11/2026 la web del Ayuntamiento respondió «prohibido» un rato), se hace
    # la actualización completa; si ya están, una rápida (unos 15 min): lo nuevo de la agenda, cine y noticias.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      minutos_lectura:
        description: "Minutos máximos leyendo páginas web (por fuente)"
        default: "28"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ¿Están ya los datos de hoy? (cada ciudad escribe su informe con la fecha de allí solo si terminó bien)
      - name: Comprobar si ya hay datos de hoy
        id: hoy
        run: |
          python - >> "$GITHUB_OUTPUT" <<'FIN'
          import datetime, json, pathlib, tomllib, zoneinfo
          ciudades = tomllib.loads(pathlib.Path("ajustes/ciudades.toml").read_text())
          hecho = True
          for cid, c in ciudades.items():
              if not c.get("activa", True):
                  continue
              hoy = datetime.datetime.now(zoneinfo.ZoneInfo(c["zona_horaria"])).date().isoformat()
              informe = pathlib.Path(f"data/ciudades/{cid}/informe.json")
              fecha = json.loads(informe.read_text()).get("fecha") if informe.exists() else None
              hecho = hecho and fecha == hoy
          print(f"hecho={'si' if hecho else 'no'}")
          FIN

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar el programa (pruebas automáticas)
        run: python -m unittest discover -s tests -t .

      # Mediodía (Uri, 19/11/2026: lo nuevo tiene que salir enseguida): si los datos de la mañana ya
      # están, actualización rápida: lo nuevo o cambiado de la agenda (6 min de guía), la IA solo para
      # eso, el cine y las noticias. Unos 15 minutos.
      - name: Actualización rápida (mediodía, si los datos del día ya están)
        if: ${{ github.event.schedule == '17 13 * * *' && steps.hoy.outputs.hecho == 'si' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python -m pipeline.principal --rapida

      - name: Actualizar datos
        if: ${{ !(github.event.schedule == '17 13 * * *' && steps.hoy.outputs.hecho == 'si') }}
        env:
          # Clave de la IA de Claude. Si no existe, se clasifica solo por señales.
          # Qué modelo hace cada tarea se decide en ajustes/ia.toml.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Clave de TMDB (datos de las películas: carteles, sinopsis, reparto…).
          # Si no existe, el cine sale con los datos de las webs de los cines.
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        # 28 minutos de guía: con la rápida del mediodía, el total queda dentro de los 2.000 minutos
        # gratis al mes de GitHub (las fichas nuevas y las de teatro, magia y circo van primero).
        run: python -m pipeline.principal --minutos-lectura "${{ github.event.inputs.minutos_lectura || '28' }}"

      # Se guarda aunque el paso anterior avise de un error: cada ciudad ya ha
      # dejado sus datos buenos (o los de ayer, si una fuente falló).
      - name: Guardar los datos en el repositorio
        if: always()
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public/datos
          if git diff --cached --quiet; then
            echo "Sin cambios hoy."
          else
            git commit -q -m "Datos del $(date -u +%Y-%m-%d)${{ steps.hoy.outputs.hecho == 'si' && github.event.schedule == '17 13 * * *' && ' (mediodía)' || '' }}"
            for intento in 1 2 3 4; do
              git pull -q --rebase && git push -q && break
              sleep $((intento * 5))
            done
          fi
