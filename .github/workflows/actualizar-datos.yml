# Proceso diario: descarga las agendas, lee fichas nuevas, clasifica y guarda
# los resultados en la carpeta data/ del repositorio. Funciona solo: nadie
# tiene que revisar nada. También se puede lanzar a mano desde la pestaña
# «Actions» → «Actualizar datos» → «Run workflow».
name: Actualizar datos

on:
  schedule:
    # Cada día a las 05:17 (hora UTC; 06:17 en invierno y 07:17 en verano en
    # Barcelona). El Ayuntamiento actualiza sus agendas de madrugada.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      minutos_guia:
        description: "Minutos máximos leyendo fichas de la guía"
        default: "35"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar el programa (pruebas automáticas)
        run: python -m unittest discover -s tests -t .

      - name: Actualizar datos
        env:
          # Clave de la IA de Claude. Si no existe, se clasifica solo por señales.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Modelo opcional (variable del repositorio MODELO_IA); por defecto claude-opus-5-5.
          MODELO_IA: ${{ vars.MODELO_IA || 'claude-opus-5-5' }}
        run: python -m pipeline.principal --minutos-guia "${{ github.event.inputs.minutos_guia || '35' }}"

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios hoy."
          else
            git commit -q -m "Datos del $(date -u +%Y-%m-%d)"
            for intento in 1 2 3 4; do
              git pull -q --rebase && git push -q && break
              sleep $((intento * 5))
            done
          fi
